name: Build Oceanway Config

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: oceanway-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            smoke_exe: src-tauri/target/release/oceanway-config.exe
            bundle_args: --bundles nsis
            artifact_path: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            smoke_exe: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oceanway Config.app/Contents/MacOS/oceanway-config
            bundle_args: --target aarch64-apple-darwin --bundles app
            artifact_path: |
              apps/desktop/dist/Oceanway-Config-macos-arm64.zip
          - platform: macos-intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            smoke_exe: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Oceanway Config.app/Contents/MacOS/oceanway-config
            bundle_args: --target x86_64-apple-darwin --bundles app
            artifact_path: |
              apps/desktop/dist/Oceanway-Config-macos-intel.zip
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test Oceanway setup and session parsers
        run: pnpm exec vitest run tests/components/OceanwayConfigPanel.test.tsx tests/types/sessionFixtures.test.ts
      - name: Test native Oceanway services
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib oceanway -- --test-threads=1
      - name: Build desktop installer
        run: pnpm tauri build ${{ matrix.bundle_args }}
      - name: Verify packaged MCP in an isolated home
        run: python src-tauri/src/oceanway_images/scripts/mcp_bundle_smoke.py --executable "${{ matrix.smoke_exe }}"
      - name: Package macOS app
        if: startsWith(matrix.platform, 'macos-')
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ditto -c -k --keepParent "src-tauri/target/$RUST_TARGET/release/bundle/macos/Oceanway Config.app" "dist/Oceanway-Config-$PLATFORM.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: Oceanway-Config-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
