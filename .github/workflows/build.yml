name: Build codex-config

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundle_args: --target aarch64-apple-darwin --bundles app
            artifact_name: codex-config-macOS-arm64
            artifact_path: |
              dist/codex-config-macOS-arm64.zip
          - platform: macos-intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bundle_args: --target x86_64-apple-darwin --bundles app
            artifact_name: codex-config-macOS-intel
            artifact_path: |
              dist/codex-config-macOS-intel.zip
          - platform: windows-x64
            os: windows-latest
            rust_target: ""
            bundle_args: --bundles nsis
            artifact_name: codex-config-Windows
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/codex-config.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Tauri bundle
        run: npm exec tauri -- build ${{ matrix.bundle_args }}

      - name: Package macOS app
        if: startsWith(matrix.platform, 'macos-')
        run: |
          mkdir -p dist
          ARCH_LABEL="${{ matrix.platform == 'macos-arm64' && 'arm64' || 'intel' }}"
          TARGET="${{ matrix.rust_target }}"
          ditto -c -k --keepParent \
            "src-tauri/target/$TARGET/release/bundle/macos/codex-config.app" \
            "dist/codex-config-macOS-$ARCH_LABEL.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
