name: Release codex-config

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: >-
              --target aarch64-apple-darwin
              --config src-tauri/tauri.updater.conf.json
              --config src-tauri/tauri.adhoc.conf.json
          - name: macOS Intel
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: >-
              --target x86_64-apple-darwin
              --config src-tauri/tauri.updater.conf.json
              --config src-tauri/tauri.adhoc.conf.json
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            args: >-
              --bundles nsis
              --config src-tauri/tauri.updater.conf.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Build signed updater artifacts and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OceanWay Codex Config v__VERSION__"
          releaseBody: "OceanWay Codex 配置、诊断与运维工具更新。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
