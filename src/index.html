<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codex-config</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <img class="app-icon" src="./assets/oceanway-ai-icon.png" alt="" />
        <div>
          <h1>OceanWay AI Codex 配置</h1>
          <p>一键写入 OceanWay AI provider，配置完成后重启 Codex。</p>
        </div>
      </header>

      <section class="status-card" aria-label="当前配置状态">
        <div>
          <span class="meta-label">当前状态</span>
          <strong id="current-provider">正在读取...</strong>
        </div>
        <div>
          <span class="meta-label">Base URL</span>
          <span id="current-base-url">-</span>
        </div>
        <div>
          <span class="meta-label">API Key</span>
          <span id="current-api-key">-</span>
        </div>
      </section>

      <form id="config-form" class="form">
        <label class="field">
          <span>API Key</span>
          <span class="input-shell">
            <input id="api-key" type="password" autocomplete="off" placeholder="请输入 API Key" required />
            <button id="toggle-key-button" type="button" class="icon-button" aria-label="显示 API Key" title="显示 API Key">
              <svg id="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </span>
        </label>

        <section class="key-profiles" aria-label="密钥档案">
          <label class="field">
            <span>密钥档案</span>
            <select id="key-profile-select">
              <option value="">未保存密钥</option>
            </select>
          </label>
          <label class="field">
            <span>密钥名称</span>
            <input id="key-profile-name" type="text" autocomplete="off" placeholder="例如：订阅密钥、余额密钥" />
          </label>
          <div class="key-profile-actions">
            <button id="save-key-profile-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
                <path d="M17 21v-8H7v8" />
                <path d="M7 3v5h8" />
              </svg>
              保存密钥
            </button>
            <button id="use-key-profile-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 7h3a4 4 0 0 1 0 8h-3" />
                <path d="M9 17H6a4 4 0 0 1 0-8h3" />
                <path d="M8 12h8" />
              </svg>
              使用档案
            </button>
            <button id="delete-key-profile-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 15h10l1-15" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
              </svg>
              删除
            </button>
          </div>
        </section>

        <label class="field">
          <span>Base URL</span>
          <span class="input-row">
            <input id="base-url" type="url" value="https://ocean-way.top" required />
            <button id="test-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z" />
              </svg>
              测试连接
            </button>
          </span>
        </label>

        <div class="actions">
          <div class="secondary-actions">
            <button id="open-dir-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z" />
              </svg>
              打开目录
            </button>
            <button id="restore-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7v5h5" />
                <path d="M5.7 12A7 7 0 1 0 8 6.8L4 10.5" />
              </svg>
              恢复默认
            </button>
            <button id="exit-button" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5H5.5A1.5 1.5 0 0 0 4 6.5v11A1.5 1.5 0 0 0 5.5 19H8" />
                <path d="M13 7l5 5-5 5" />
                <path d="M18 12H8" />
              </svg>
              退出
            </button>
          </div>
          <button id="configure-button" type="submit" class="primary">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            一键配置
          </button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <footer class="footer">codex-config v1.0.0</footer>
    </main>
  </body>
</html>
