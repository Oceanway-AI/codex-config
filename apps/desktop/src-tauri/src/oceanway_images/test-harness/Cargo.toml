[package]
name = "oceanway-image-service-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[lib]
path = "lib.rs"

[[bin]]
name = "oceanway-image-mcp-fixture"
path = "stdio.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "process", "time", "sync", "macros"] }

